server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA is built with baseHref "/{{IMAGE_NAME}}/" (see colossus.yaml), so the
  # browser asks for the API at "/<image-name>/api/..." when the app is served from
  # a preview sub-path and at "/api/..." when it is served from the site root.
  # This regex accepts both shapes and forwards the path after "/api/" unchanged.
  # It is declared before "location /" because a regex location wins over the
  # prefix match, which would otherwise swallow API calls into the SPA fallback.
  location ~ ^(?:/[^/]+)?/api/(.*)$ {
    # Port 3001 matches the backend's listen port (backend/Dockerfile ENV PORT=3001,
    # colossus.yaml backend.port). Proxying to 3000 here silently 502s every call.
    proxy_pass http://backend:3001/api/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Authorization must survive the hop or every admin call arrives unauthenticated.
    proxy_pass_request_headers on;
  }

  location / { try_files $uri $uri/ /index.html; }
}
